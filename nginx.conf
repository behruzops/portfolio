server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip (text assets only; pdf/png are already compressed) ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- security headers (inherited by locations that use only `expires`) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- long cache for static assets ----
    location ~* \.(?:css|js|svg|png|jpe?g|gif|ico|woff2?|pdf)$ {
        expires 30d;
        access_log off;
    }

    # ---- html: always revalidate so updates show immediately ----
    location ~* \.html$ {
        expires -1;
    }

    try_files $uri $uri/ =404;
}
